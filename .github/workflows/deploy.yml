on:
  workflow_call:
    inputs:
      NAIS_MANAGEMENT_PROJECT_ID:
        required: true
        type: string
      env:
        required: true
        type: string
    secrets:
      NAIS_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      SLACK_WEBHOOK:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  test-build-and-push:
    name: Test, build and push
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: 'temurin'
        cache: 'gradle'
    - name: PLEASE - Test
      run: ./gradlew test
    - name: Build and push image and SBOM to OCI registry
      uses: nais/docker-build-push@2d2b0a7193e65422b7f0355d4afb445e0a8b2cc3
      id: docker-build-push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
      with:
        team: dab
    - name: Deploy to NAIS ${{ inputs.env }}
      uses: nais/deploy/actions/deploy@fc3eae3edebabdf67f7592102ae16176d5ba3b5f
      env:
        CLUSTER: ${{ inputs.env }}-gcp
        RESOURCE: nais/nais-${{ inputs.env }}.yaml
        VAR: image=${{ steps.docker-build-push.outputs.image }}
        TELEMETRY: ${{ steps.docker-build-push.outputs.telemetry }}
        DEPLOY_SERVER: deploy.nav.cloud.nais.io:443
    - name: Slack Notification (deploy failure)
      if: failure() && inputs.env == 'prod'
      uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58
      env:
        SLACK_COLOR: danger
        SLACK_USERNAME: Github Actions
        SLACK_ICON: https://github.com/github.png?size=48
        SLACK_TITLE: 'Please: deploy til prod feilet'
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_MESSAGE: 'Commit-message til feilende deploy: ${{ github.event.head_commit.message }}'